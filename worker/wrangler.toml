name = "davar-tutor"
main = "src/index.js"
compatibility_date = "2025-06-01"

# The tutor answers at https://tutor.davarhebrew.app
routes = [{ pattern = "tutor.davarhebrew.app", custom_domain = true }]

# At most 8 questions per minute from one visitor.
[[ratelimits]]
name = "TUTOR_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[vars]
# Leave empty to use Google's current Flash model; set a model id to pin one.
GEMINI_MODEL = ""

# GEMINI_API_KEY is a secret: set it in the Cloudflare dashboard (Settings > Variables and Secrets), never here.
